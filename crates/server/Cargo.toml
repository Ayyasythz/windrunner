[package]
name = "windrunner-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
windrunner-types.workspace = true
windrunner-engine.workspace = true
windrunner-exchange.workspace = true
windrunner-history.workspace = true
serde.workspace = true
axum = { version = "0.8.9", features = ["ws"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time"] }
serde_json = "1.0.154"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tower-http = { version = "0.7.1", features = ["cors"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tempfile.workspace = true
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
