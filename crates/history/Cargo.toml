[package]
name = "windrunner-history"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
windrunner-types.workspace = true
windrunner-exchange.workspace = true
serde.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
windrunner-engine.workspace = true
